<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="btGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Wi-Fi Waves (Left/Top side) -->
  <g transform="translate(14, 18)" stroke="url(#wifiGrad)" stroke-linecap="round" fill="none">
    <!-- Outer Arc -->
    <path d="M 6 36 A 40 40 0 0 1 54 36" stroke-width="5" />
    <!-- Mid Arc -->
    <path d="M 14 44 A 26 26 0 0 1 46 44" stroke-width="4.5" />
    <!-- Inner Arc -->
    <path d="M 22 52 A 13 13 0 0 1 38 52" stroke-width="4" />
    <!-- Center Dot -->
    <circle cx="30" cy="60" r="3.5" fill="#38bdf8" stroke="none" />
  </g>

  <!-- Bluetooth Rune (Right side) -->
  <g transform="translate(74, 32)">
    <circle cx="22" cy="32" r="28" fill="#1e293b" fill-opacity="0.7" stroke="#6366f1" stroke-width="2" />
    <!-- Bluetooth Path -->
    <path d="M 22 14 L 22 50 L 32 41 L 12 23 L 32 23 L 22 32 L 12 41" 
          stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  </g>

  <!-- Speed pill badge at bottom -->
  <g transform="translate(24, 96)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <path d="M 8 10 L 14 5 L 14 8 L 22 8 L 22 12 L 14 12 L 14 15 Z" fill="#38bdf8" />
    <text x="26" y="14" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">WIFI &amp; BT</text>
  </g>
</svg>
